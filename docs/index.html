<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillClerk · starting</title>
<meta name="description" content="BillClerk checks supplier invoices before you pay them.">
<style>
  /* The always-on front door for BillClerk. The app itself runs on a free server
     that sleeps when idle; this page wakes it, explains the wait, and opens it. */
  :root { --ink: #1D2B3A; --soft: #536170; --paper: #F5F8F3; --violet: #4338A0; --line: #E1EBE4; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: repeating-linear-gradient(180deg, transparent 0 31px, rgba(201,217,206,.45) 31px 32px), var(--paper); }
  .card { width: min(480px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 2rem 1.75rem; text-align: center; box-shadow: 0 22px 44px -28px rgba(29,43,58,.55); }
  .logo { color: var(--violet); }
  h1 { font-size: 1.6rem; margin: 0.4rem 0 0.2rem; }
  .tag { color: var(--soft); margin: 0 0 1.5rem; }
  .status { font-weight: 600; font-size: 1.05rem; }
  .why { color: var(--soft); font-size: 0.93rem; margin: 0.4rem 0 1.25rem; line-height: 1.5; }
  .bar { height: 8px; background: #ECEAFB; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--violet); border-radius: 99px; transition: width 1s linear; }
  .time { font-size: 0.85rem; color: var(--soft); margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
  a { color: var(--violet); font-weight: 600; }
  .links { margin-top: 1.5rem; font-size: 0.9rem; color: var(--soft); }
  .ready .bar i { width: 100% !important; background: #17784A; }
</style>
</head>
<body>
<main class="card" id="card">
  <svg class="logo" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6h-4z"/><path d="M5 13h14v4H5z"/><path d="M7 21h10"/><path d="M10 9v4M14 9v4"/></svg>
  <h1>BillClerk</h1>
  <p class="tag">Checks supplier invoices before you pay them.</p>
  <p class="status" id="status" role="status">Starting BillClerk…</p>
  <p class="why" id="why">This demo runs on a free server that goes to sleep when no one is using it.
    It's waking up now, which usually takes 30 to 60 seconds. It will open by itself.</p>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <p class="time" id="time"></p>
  <p class="links"><a id="open" href="#">Open it directly</a> · <a href="https://github.com/himank09/BillClerk">Code on GitHub</a></p>
</main>
<script>
  const APP = "https://billclerk.onrender.com";  // the live app
  document.getElementById("open").href = APP;
  const start = Date.now();
  const $ = id => document.getElementById(id);

  // The server answers /api/ping with {"app": "billclerk"} once it's awake.
  // While it's waking, the host returns its own page instead, so we keep asking.
  async function awake() {
    try {
      const r = await fetch(APP + "/api/ping", { cache: "no-store" });
      return (await r.json()).app === "billclerk";
    } catch { return false; }
  }

  function tick() {
    const s = Math.round((Date.now() - start) / 1000);
    $("bar").style.width = Math.min(95, s / 60 * 95) + "%";  // fills over about a minute
    $("time").textContent = s < 2 ? "" : `${s} seconds`;
    if (s > 90) $("why").textContent = "Taking longer than usual. Hang on a little more, or use the link below.";
  }

  (async () => {
    const timer = setInterval(tick, 1000);
    while (!(await awake())) await new Promise(r => setTimeout(r, 3000));
    clearInterval(timer);
    $("card").classList.add("ready");
    $("status").textContent = "Ready. Opening BillClerk…";
    $("why").textContent = "";
    location.replace(APP);
  })();
</script>
</body>
</html>
